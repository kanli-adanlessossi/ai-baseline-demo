# Keeps pinned versions current through reviewed pull requests instead of silent "latest" upgrades.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /services/web
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /services/orders
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /services/payments
    schedule:
      interval: weekly
